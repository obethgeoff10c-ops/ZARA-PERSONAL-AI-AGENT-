[project]
name = "zara"
version = "0.1.0"
description = "ZARA core API and agent service"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.14,<2",
  "asyncpg>=0.30,<1",
  "fastapi>=0.115,<1",
  "pgvector>=0.3.6,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "redis>=5.2,<7",
  "sqlalchemy[asyncio]>=2.0.36,<3",
  "uvicorn[standard]>=0.32,<1",
  "uuid-utils>=0.10,<1",
  "pyjwt[crypto]>=2.10,<3",
  "email-validator>=2.2,<3",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "httpx2>=2.16.2",
  "import-linter>=2.1,<3",
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "pytest-cov>=6,<8",
  "ruff>=0.8,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["zara"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "integration: requires a live PostgreSQL (and optionally Redis) instance",
]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["zara"]
omit = ["zara/entrypoints/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["zara", "tests"]

[tool.ruff.lint]
select = [
  "E", "F", "W",      # pycodestyle / pyflakes
  "I",                # isort
  "B",                # bugbear
  "UP",               # pyupgrade
  "SIM",              # simplify
  "ASYNC",            # async correctness
  "S",                # bandit-style security
  "RUF",
]
ignore = [
  "S101",             # asserts are expected in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
# Autogenerated DDL is reviewed, not hand-formatted; schema names are literals.
"alembic/versions/*.py" = ["E501", "S608"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_unused_ignores = true
disallow_any_generics = true
no_implicit_reexport = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pgvector.*", "uuid_utils.*"]
ignore_missing_imports = true

[tool.importlinter]
root_packages = ["zara"]

[[tool.importlinter.contracts]]
name = "Layered architecture"
type = "layers"
layers = [
  "zara.api",
  "zara.db",
  "zara.observability",
  "zara.config",
]
